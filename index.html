<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardianes de la Red · Taller interactivo (10-13 años)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka@5.0.13/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka@5.0.13/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.13/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.13/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.13/900.css">
<style>
:root{
  --navy:#0d1830; --ink:#12203a; --muted:#5d6e8a;
  --teal:#17c3b2; --tealD:#0f9c8e; --coral:#ff6b6b; --coralD:#e04f4f;
  --yellow:#ffd23f; --yellowD:#e0b31f; --purple:#8b5cf6; --sky:#4cc9f0;
  --green:#3ddc84; --greenD:#28b468; --paper:#ffffff; --paper2:#f4f8ff;
  --r:20px; --shadow:0 10px 0 rgba(0,0,0,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#eaf1ff;min-height:100vh;
  background:radial-gradient(1000px 520px at 12% -8%, #23457a 0%, transparent 60%),
    radial-gradient(800px 480px at 92% 4%, #1b6f74 0%, transparent 55%),
    linear-gradient(180deg,#0d1830 0%,#111f3c 45%,#0a1426 100%);background-attachment:fixed}
h1,h2,h3,h4,.f{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:700;letter-spacing:.2px}
button{font-family:'Fredoka','Nunito',sans-serif}
::selection{background:var(--yellow);color:#12203a}
#stars-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
#stars-bg i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:14px 16px 90px}
#topbar{position:sticky;top:0;z-index:60;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(9,17,34,.95),rgba(9,17,34,.72));border-bottom:2px solid rgba(255,255,255,.08)}
.tb{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.tb .logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.tb .logo svg{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tb .logo b{font-family:'Fredoka';font-size:19px;line-height:1;display:block;color:#fff}
.tb .logo span{font-size:11px;color:#9fb4d8;letter-spacing:.6px;text-transform:uppercase}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.14);
  padding:6px 12px;border-radius:999px;font-weight:900;font-size:13px;color:#fff;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.chip.gold{background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#3a2600;border-color:#ffe9a8}
.xpwrap{min-width:150px}
.xpbar{height:9px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sky),var(--yellow));border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.2,1)}
.xpwrap small{font-size:10.5px;color:#a9bde0;letter-spacing:.4px}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card.dark{background:linear-gradient(160deg,#182c52,#101d38);color:#e8f0ff;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:none;cursor:pointer;padding:12px 20px;border-radius:16px;font-size:15px;font-weight:700;color:#12203a;
  background:var(--yellow);box-shadow:0 5px 0 var(--yellowD);transition:.08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellowD)}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 var(--tealD);color:#04231f}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coralD);color:#fff}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 #6b3fd1;color:#fff}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-weight:900;font-size:12px;letter-spacing:.3px}
.tag{background:#e8f0ff;color:#28447a;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:800;display:inline-block}
h2.sec{font-size:clamp(20px,3.4vw,30px);margin:0 0 4px}
.lead{color:#4a5c7a;margin:0 0 14px;font-size:15px;line-height:1.6}
.dark .lead{color:#b9c9e8}
hr.sep{border:none;border-top:2px dashed rgba(18,32,58,.14);margin:18px 0}
ul.tick{list-style:none;padding:0;margin:8px 0}
ul.tick li{padding:7px 0 7px 32px;position:relative;line-height:1.5;font-size:14.5px;color:#33415e}
ul.tick li:before{content:"✔";position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;
  background:#e3fff6;color:var(--tealD);font-size:12px;display:grid;place-items:center;font-weight:900}
.dark ul.tick li{color:#dbe6fb}
.dark ul.tick li:before{background:rgba(23,195,178,.2);color:#5ff0e0}
.box{border-radius:16px;padding:14px 16px;margin:12px 0;font-size:14.5px;line-height:1.6}
.box.tip{background:#e8fbf6;border-left:6px solid var(--teal)}
.box.warn{background:#fff1f1;border-left:6px solid var(--coral)}
.box.note{background:#fff8e1;border-left:6px solid var(--yellow)}
.box.info{background:#eef3ff;border-left:6px solid var(--sky)}
.dark .box.tip{background:rgba(23,195,178,.14);color:#dffaf3}
.dark .box.warn{background:rgba(255,107,107,.14);color:#ffe2e2}
.dark .box.note{background:rgba(255,210,63,.14);color:#fff5d4}
.dark .box.info{background:rgba(76,201,240,.14);color:#dff3ff}
.box b{font-family:'Fredoka'}
.illus{width:100%;height:auto;display:block;border-radius:16px}
.artframe{background:linear-gradient(160deg,#f7fbff,#e9f2ff);border-radius:18px;padding:10px;border:2px dashed #c9dcf5}
.dark .artframe{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center;
  background:linear-gradient(135deg,rgba(23,195,178,.2),rgba(139,92,246,.22));border:2px solid rgba(255,255,255,.16);
  border-radius:28px;padding:24px;margin-bottom:22px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(26px,5vw,46px);line-height:1.05;margin:0 0 10px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.hero p{color:#d6e4ff;font-size:16px;line-height:1.6;margin:0 0 14px}
.namebox{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],textarea,select{font-family:'Nunito';font-size:15px;padding:11px 14px;border-radius:14px;border:2px solid #cfdcf2;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(23,195,178,.2)}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.mod{background:var(--paper);color:var(--ink);border-radius:24px;padding:0;overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;transition:.22s;border:3px solid transparent;text-align:left;display:block;width:100%}
.mod:hover{transform:translateY(-6px) rotate(-.5deg);border-color:var(--yellow)}
.mod .top{padding:16px 18px;color:#fff;position:relative;overflow:hidden;min-height:118px}
.mod .top svg{position:absolute;right:-8px;bottom:-8px;width:120px;opacity:.95}
.mod .num{font-family:'Fredoka';font-size:12px;letter-spacing:2px;opacity:.9}
.mod h3{margin:2px 0 0;font-size:20px;line-height:1.15;max-width:62%}
.mod .body{padding:14px 18px 18px}
.mod .body p{font-size:13.5px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;color:var(--ink);
  background:conic-gradient(var(--teal) calc(var(--p)*1%), #e6edf9 0)}
.ring span{background:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.modhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.modhead .big{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px;flex:0 0 auto;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tabs{display:flex;gap:8px;background:rgba(255,255,255,.08);padding:6px;border-radius:99px;margin-bottom:18px;flex-wrap:wrap;border:2px solid rgba(255,255,255,.12)}
.tab{flex:1;min-width:110px;border:none;background:transparent;color:#c9d8f5;padding:11px 14px;border-radius:99px;cursor:pointer;font-size:14.5px;font-weight:700;transition:.2s}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.acc{border-radius:18px;background:#fff;color:var(--ink);margin-bottom:12px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.acc>button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:none;padding:16px 18px;cursor:pointer;text-align:left;font-size:16.5px;font-weight:700;font-family:'Fredoka';color:var(--ink)}
.acc>button .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.acc>button .ar{margin-left:auto;transition:.25s;color:#94a6c4}
.acc.open>button .ar{transform:rotate(90deg)}
.acc .in{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc.open .in{max-height:4000px}
.acc .pad{padding:0 18px 18px}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.flip{perspective:900px;height:170px;cursor:pointer}
.flip .in2{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in2{transform:rotateY(180deg)}
.flip .fc,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:center}
.flip .fc{background:linear-gradient(150deg,#1e3a68,#16294a);color:#fff;border:2px solid rgba(255,255,255,.14)}
.flip .bk{transform:rotateY(180deg);background:#fff;color:var(--ink);border:2px solid #dbe6f7;font-size:13.2px;line-height:1.45;overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.4px;background:#fff;border-radius:14px;overflow:hidden}
table.tbl th{background:var(--ink);color:#fff;padding:10px 8px;text-align:left;font-family:'Fredoka';font-weight:600;font-size:12.6px}
table.tbl td{padding:9px 8px;border-bottom:1px solid #eaf0fa;color:#31415e;vertical-align:top}
table.tbl tr:nth-child(even) td{background:#f8fbff}
table.tbl tr:hover td{background:#eefaf7}
.scrollx{overflow-x:auto;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.game{background:linear-gradient(160deg,#16294a,#0e1a33);border-radius:24px;padding:18px;border:2px solid rgba(255,255,255,.12);color:#eaf1ff}
.game h3{margin:0 0 6px;font-size:22px;color:#fff}
.qbar{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:3px solid transparent;border-radius:16px;
  padding:13px 16px;margin-bottom:10px;cursor:pointer;font-size:15px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:.12s}
.opt:hover{transform:translateY(-2px);border-color:var(--sky)}
.opt.ok{background:#e2fff0;border-color:var(--green);box-shadow:0 5px 0 var(--greenD)}
.opt.no{background:#ffe9e9;border-color:var(--coral);box-shadow:0 5px 0 var(--coralD)}
.opt.dis{opacity:.6;cursor:not-allowed}
canvas#pac{display:block;width:100%;max-width:640px;height:auto;margin:0 auto;border-radius:14px;background:#060b1c;border:3px solid #2b4d8f;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px;justify-content:center;margin:12px auto 0;user-select:none}
.dpad button{border:none;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:none}
.dpad button:active{background:var(--teal);color:#04231f;transform:translateY(3px);box-shadow:none}
.hearts{font-size:20px;letter-spacing:2px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,12,30,.88);border-radius:20px;z-index:5;padding:18px;text-align:center;overflow:auto}
.overlay .oc{max-width:440px}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pbar{height:12px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));width:0;transition:width .4s}
.starsrow{font-size:34px;letter-spacing:6px}
.drag{background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14px;font-weight:800;cursor:pointer;
  border-left:6px solid var(--sky);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:.15s}
.drag:hover{transform:translateX(4px)}
.drag.sel{border-left-color:var(--yellow);background:#fffbe8}
.drag.done{opacity:.42;border-left-color:var(--green);text-decoration:line-through}
.dropz{border:3px dashed rgba(255,255,255,.28);border-radius:16px;padding:12px;min-height:70px;margin-bottom:10px;transition:.2s}
.dropz:hover{border-color:var(--yellow);background:rgba(255,210,63,.07)}
.dropz.hit{border-color:var(--green);background:rgba(61,220,132,.12)}
.stepchip{display:flex;gap:10px;align-items:flex-start;background:#fff;color:var(--ink);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.stepchip .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.zone{border-radius:14px;padding:12px;font-size:13.5px;font-weight:800;cursor:pointer;border:3px solid transparent;transition:.2s;text-align:center}
.zone.on{transform:scale(1.04);border-color:#fff}
.count{font-weight:900;font-size:13px;padding:4px 10px;border-radius:99px;background:#eef3ff;color:#2c4a80}
.count.good{background:#dcffe9;color:#166b3a}
.count.bad{background:#ffe6e6;color:#a02c2c}
.mapnode{border-radius:14px;padding:8px 12px;margin:6px 0;font-size:13.5px;font-weight:800;color:#fff;display:flex;gap:8px;align-items:center}
.mapnode button{margin-left:auto;background:rgba(0,0,0,.2);border:none;color:#fff;border-radius:8px;cursor:pointer;padding:2px 8px}
.mindmap{position:relative;background:radial-gradient(circle at 50% 30%,#fff,#eef4ff);border-radius:18px;padding:18px;color:var(--ink)}
.mmcenter{width:150px;height:150px;border-radius:50%;background:linear-gradient(150deg,var(--purple),#5b34c9);color:#fff;display:grid;place-items:center;
  text-align:center;padding:14px;margin:0 auto;font-family:'Fredoka';font-size:14px;box-shadow:0 8px 0 rgba(0,0,0,.16);position:relative}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.branch{border-radius:16px;padding:12px;color:#fff;min-height:120px}
.branch h4{margin:0 0 8px;font-size:15px}
.cert{background:linear-gradient(160deg,#fffdf5,#fff6dd);color:#3a2c00;border:6px double #d4a72c;border-radius:20px;padding:28px;text-align:center}
.badge{display:inline-grid;place-items:center;width:74px;height:74px;border-radius:50%;background:linear-gradient(150deg,#ffd23f,#ff9f1c);
  box-shadow:0 6px 0 #b9781a;font-size:30px;margin:4px}
.badge.off{background:#2a3a5c;box-shadow:0 6px 0 #1b2740;filter:grayscale(1);opacity:.5}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);z-index:200;background:#12203a;color:#fff;
  padding:13px 22px;border-radius:99px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.35s;border:2px solid rgba(255,255,255,.2);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(4,10,24,.8);z-index:300;display:none;place-items:center;padding:18px}
#modal.on{display:grid}
#modal .mc{background:#fff;color:var(--ink);border-radius:22px;padding:24px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s}
.flow{display:flex;flex-direction:column}
.fstep{display:flex;gap:12px;align-items:flex-start}
.fstep .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 auto;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.fstep .ln{width:4px;height:24px;background:#d6e2f5;margin-left:17px}
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cyc{background:#fff;border-radius:14px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer;border-top:6px solid var(--sky);transition:.2s}
.cyc:hover{transform:translateY(-4px)}
.cyc b{display:block;font-family:'Fredoka';font-size:14px;margin-bottom:4px;color:var(--ink)}
.cyc small{color:#5d6e8a;font-size:12.4px;line-height:1.45;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:800;color:#c9d8f5;margin-top:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-2px}
.fab{position:fixed;right:16px;bottom:16px;z-index:80}
.fab button{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.small{font-size:12.5px;color:var(--muted)}
.dark .small{color:#9fb4d8}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.12);font-size:14px;color:var(--ink);font-weight:700;border-left:6px solid #dfe8f7}
.chk.on{border-left-color:var(--green);background:#f2fff7}
.chk .bx{width:24px;height:24px;border-radius:8px;border:3px solid #c6d5ec;flex:0 0 auto;display:grid;place-items:center;font-size:13px;color:transparent}
.chk.on .bx{background:var(--green);border-color:var(--greenD);color:#fff}
#print-area{display:none}
/* ===== LABERINTO ===== */
.pacgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:16px;align-items:start}
@media(max-width:900px){.pacgrid{grid-template-columns:1fr}}
#pOpts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.orow{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);
  border-radius:14px;padding:9px 11px;font-size:14px;font-weight:800;color:#eaf1ff;transition:.2s;line-height:1.35}
.orow .sw{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-family:'Fredoka';font-size:16px;color:#12203a;box-shadow:0 3px 0 rgba(0,0,0,.28), inset 0 0 0 2px rgba(255,255,255,.55)}
.orow.dead{opacity:.4;text-decoration:line-through;border-color:rgba(255,107,107,.5)}

function beep(f,d,type,v){
  if(!SOUND)return;

    o.type=type||'square';o.frequency.value=f;g.gain.value=(v===undefined?.06:v);
    o.connect(g);g.connect(AC.destination);o.start();

  }catch(e){}
}

  let c=0;acts.forEach(k=>{if(S.done[k])c++});if(S.missions['m'+n])c++;
  return Math.round(c/4*100);
}

function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

        <button class="btn purple" onclick="startClassifier()">Jugar al clasificador ▶</button>
      </div>
    </div>
  </div>`;
  startPac();
}

function startPac(){
  const cv=$('#pac');if(!cv)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=MW*CELL*dpr;cv.height=MH*CELL*dpr;
  cv.style.aspectRatio=(MW*CELL)+' / '+(MH*CELL);
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);

  PAC={
    cv,ctx,dpr,
    questions:shuffle(PAC_QUESTIONS).slice(0,TOTAL_LEVELS),
    lvl:0,lives:3,maxLives:5,score:0,dotsEaten:0,dotsTotal:0,
    grid:MAZES[0],mazeIdx:0,
    started:false,paused:false,over:false,runOver:false,
    eaten:new Set(),dead:{},orbs:{},answers:[],colors:[],okIndex:-1,
    hintUsed:false,hintSlot:null,hintUntil:0,
    want:3,raf:null,last:performance.now(),freeze:0,tick:0,
    marks:[],allDots:false
  };
  const keyH=e=>{
    if(!PAC)return;
    const k=e.key.toLowerCase();let d=null;
    if(k==='arrowup'||k==='w')d=0;else if(k==='arrowdown'||k==='s')d=1;
    else if(k==='arrowleft'||k==='a')d=2;else if(k==='arrowright'||k==='d')d=3;
    else if(k===' '){togglePause();e.preventDefault();return}
    else if(k==='h'){useHint();e.preventDefault();return}
    else if(k==='r'){if(!PAC.over&&!PAC.runOver)restartLevel();e.preventDefault();return}
    if(d!==null){PAC.want=d;e.preventDefault();if(!PAC.started&&!PAC.over)beginPlay()}
  };
  document.addEventListener('keydown',keyH);

  const dpadBtns=$$('.dpad button[data-d]');
  const dpadH=e=>{e.preventDefault();if(!PAC)return;PAC.want=parseInt(e.currentTarget.dataset.d);
    if(!PAC.started&&!PAC.over&&!PAC.runOver)beginPlay()};
  dpadBtns.forEach(b=>b.addEventListener('pointerdown',dpadH));

  $('#pPause').onclick=togglePause;
  $('#pHint').onclick=useHint;
  $('#pRestart').onclick=restartLevel;

  let tS=null;
  const tsH=e=>{const t=e.touches[0];tS={x:t.clientX,y:t.clientY}};
  const teH=e=>{
    if(!tS||!PAC)return;const t=e.changedTouches[0];
    const dx=t.clientX-tS.x,dy=t.clientY-tS.y;tS=null;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    PAC.want=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?1:0);
    if(!PAC.started&&!PAC.over&&!PAC.runOver)beginPlay();
  };
  cv.addEventListener('touchstart',tsH,{passive:true});
  cv.addEventListener('touchend',teH,{passive:true});

  CLEANUP=()=>{
    document.removeEventListener('keydown',keyH);
    dpadBtns.forEach(b=>b.removeEventListener('pointerdown',dpadH));
    cv.removeEventListener('touchstart',tsH);cv.removeEventListener('touchend',teH);
    if(PAC&&PAC.raf)cancelAnimationFrame(PAC.raf);
    PAC=null;
  };

  setupLevel();
  PAC.raf=requestAnimationFrame(loop);
}
function cfg(){return LEVEL_CFG[Math.min(PAC.lvl,TOTAL_LEVELS-1)]}
function togglePause(){
  if(!PAC||PAC.over||PAC.runOver)return;
  if(!PAC.started){beginPlay();return}
  PAC.paused=!PAC.paused;$('#pPause').textContent=PAC.paused?'▶':'⏸';sfx.click();
}
function beginPlay(){
  if(!PAC||PAC.started||PAC.runOver)return;
  PAC.started=true;PAC.freeze=1500;PAC.last=performance.now();
  const o=$('#pOverlay');if(o)o.style.display='none';
  $('#pPause').textContent='⏸';beep(660,.08,'triangle',.05);
}
function setupLevel(){
  const r=PAC.questions[PAC.lvl],cf=cfg();
  /* respuestas barajadas entre los 4 slots A-D */
  const pairs=r.a.map((txt,i)=>({txt,ok:i===r.ok}));
  PAC.answers=shuffle(pairs);
  PAC.okIndex=PAC.answers.findIndex(x=>x.ok);
  /* COLORES ALEATORIOS del conjunto de opciones (cada nivel cambia) */
  PAC.colors=shuffle(ORB_PALETTE).slice(0,4);
  /* plano del laberinto según tramo de dificultad */
  PAC.mazeIdx=cf.maze;
  PAC.grid=MAZES[PAC.mazeIdx];
  let dots=0;
  for(let rr=0;rr<MH;rr++)for(let cc=0;cc<MW;cc++)if(PAC.grid[rr][cc]==='.')dots++;
  PAC.dotsTotal=dots;PAC.dotsEaten=0;PAC.allDots=false;
  PAC.orbs={};ORB_CELLS.forEach((cell,i)=>{PAC.orbs[cell[0]+','+cell[1]]=i});
  PAC.dead={};PAC.eaten=new Set();PAC.hintUsed=false;PAC.hintSlot=null;PAC.want=3;
  $('#pHint').disabled=false;
  PAC.pac={r:START.r,c:START.c,dir:3,buffer:null,prog:0,speed:cf.ps};
  PAC.ghosts=[];
  for(let i=0;i<cf.ghosts;i++){
    PAC.ghosts.push({r:GHOST_HOME[i][0],c:GHOST_HOME[i][1],dir:(i%2===0?3:2),prog:0,
      speed:cf.gs[i],color:GHOST_COLS[i%GHOST_COLS.length],decide:true});
  }
  PAC.freeze=PAC.started?1200:0;
  paintHud(r,cf);
}
function paintHud(r,cf){
  const q=$('#pq'),op=$('#pOpts');if(!q||!op)return;
  q.innerHTML='<b style="color:#ffd23f">Nivel '+(PAC.lvl+1)+' de '+TOTAL_LEVELS+':</b> '+esc(r.q);
  op.innerHTML=PAC.answers.map((a,i)=>
    '<div class="orow" data-slot="'+i+'"><span class="sw" style="background:'+PAC.colors[i].c+'">'+LETTERS[i]+

    '</b> · 🎯 Precisión del algoritmo: <b style="color:#c9d8f5">'+Math.round(cf.chase*100)+'%</b>';
  paintLvlStrip();paintLives();
  if(!PAC.started){
    const o=$('#pOverlay');o.style.display='grid';
    o.innerHTML='<div class="oc pop"><div style="font-size:52px">🕹️</div>'+
      '<h3 class="f" style="color:#ffd23f">El Laberinto de la Atención</h3>'+
      '<div class="pill" style="background:rgba(255,255,255,.14);color:#fff;margin-bottom:8px">'+TOTAL_LEVELS+' niveles · 3 mapas · hasta 4 fantasmas</div>'+
      '<p style="color:#dbe6fb;font-size:14px;line-height:1.55">Lee la pregunta y el panel de opciones. Cada opción tiene '+
      '<b>una esfera de color aleatorio</b> en una esquina del laberinto. '+
      '<b style="color:#3ddc84">Solo debes comer la esfera de la respuesta correcta.</b> '+
      'Las semillas suman puntos; los fantasmas te quitan una vida. Cada 3 niveles ganas una 💖 vida extra.</p>'+
      '<button class="btn teal" onclick="beginPlay()">▶ JUGAR</button></div>';
  }
}
function paintLvlStrip(){
  const c=$('#pLevels');if(!c)return;
  let h='';
  for(let i=0;i<TOTAL_LEVELS;i++){
    let cls='';
    if(PAC.marks[i]==='win')cls='win';
    else if(PAC.marks[i]==='lose')cls='lose';
    else if(i===PAC.lvl)cls='cur';
    h+='<b class="'+cls+'">'+(i+1)+'</b>';
  }
  c.innerHTML=h;
}
function paintLives(){
  if(!PAC)return;
  const l=$('#pLives');if(l)l.textContent='❤️'.repeat(Math.max(0,PAC.lives));
  const s=$('#pScore');if(s)s.textContent=PAC.score;
  const d=$('#pDots');if(d)d.textContent=PAC.dotsTotal?Math.round(PAC.dotsEaten/PAC.dotsTotal*100):0;
}
function markSlot(slot,cls){const row=document.querySelector('.orow[data-slot="'+slot+'"]');if(row)row.classList.add(cls)}
function useHint(){
  if(!PAC||PAC.over||PAC.runOver||PAC.hintUsed||!PAC.started)return;
  PAC.hintUsed=true;PAC.score=Math.max(0,PAC.score-25);paintLives();
  $('#pHint').disabled=true;
  markSlot(PAC.okIndex,'hintit');
  PAC.hintSlot=PAC.okIndex;PAC.hintUntil=PAC.tick+2200;
  sfx.click();toast('💡 La esfera correcta parpadea 2 segundos');
}
function restartLevel(){
  if(!PAC)return;
  PAC.over=false;PAC.paused=false;$('#pPause').textContent='⏸';
  $('#pOverlay').style.display='none';
  setupLevel();
}
/* ---------- geometría segura ---------- */
function wall(r,c){
  if(!Number.isInteger(r)||!Number.isInteger(c))return true;
  if(r<0||c<0||r>=MH||c>=MW)return true;
  const g=PAC?PAC.grid:MAZES[0];
  return g[r][c]==='#';
}
function nextOpen(r,c,d){return d!=null&&!wall(r+DR[d],c+DC[d])}
function openDirs(r,c){const o=[];for(let d=0;d<4;d++){if(!wall(r+DR[d],c+DC[d]))o.push(d)}return o}
function posOf(e){
  const d=(e.dir==null)?0:e.dir,pr=e.prog||0;
  return {x:(e.c+DC[d]*pr)*CELL+CELL/2,y:(e.r+DR[d]*pr)*CELL+CELL/2};
}
/* ---------- bucle ---------- */
function loop(ts){
  if(!PAC)return;
  const dt=Math.min(64,ts-PAC.last);PAC.last=ts;
  PAC.tick+=dt;
  if(PAC.started&&!PAC.paused&&!PAC.over&&!PAC.runOver){
    if(PAC.freeze>0)PAC.freeze-=dt;
    else update(dt);
  }
  draw();
  PAC.raf=requestAnimationFrame(loop);
}
function update(dt){
  updatePac(dt);
  if(PAC.over||PAC.runOver)return;
  PAC.ghosts.forEach(g=>updateGhost(g,dt));
  if(PAC.over||PAC.runOver)return;
  const pp=posOf(PAC.pac);
  for(let i=0;i<PAC.ghosts.length;i++){
    const gp=posOf(PAC.ghosts[i]);
    if(Math.hypot(pp.x-gp.x,pp.y-gp.y)<CELL*0.6){hitGhost();break}
  }
  if(PAC.dotsEaten>=PAC.dotsTotal&&!PAC.allDots){
    PAC.allDots=true;PAC.score+=100;paintLives();toast('🌟 ¡Laberinto limpio! +100 puntos');sfx.star();
  }
}
function updatePac(dt){
  const p=PAC.pac,w=PAC.want;
  if(w!=null){
    if(p.dir!=null&&w===(p.dir^1)&&nextOpen(p.r,p.c,w)){p.prog=1-p.prog;p.dir=w}
    else p.buffer=w;
  }
  if(!nextOpen(p.r,p.c,p.dir)){
    if(p.buffer!=null&&nextOpen(p.r,p.c,p.buffer)){p.dir=p.buffer;p.buffer=null}
    else{
      const opts=openDirs(p.r,p.c).filter(d=>d!==(p.dir^1));
      if(opts.length)p.dir=opts[0];else{p.prog=0;return}
    }
  }
  if(!nextOpen(p.r,p.c,p.dir)){p.prog=0;return}
  p.prog+=dt/p.speed;
  let guard=0;
  while(p.prog>=1&&guard++<4){
    p.prog-=1;p.r+=DR[p.dir];p.c+=DC[p.dir];
    arrivePac();
    if(PAC.over||PAC.runOver)return;
    if(p.buffer!=null&&nextOpen(p.r,p.c,p.buffer)){p.dir=p.buffer;p.buffer=null}
    else if(!nextOpen(p.r,p.c,p.dir)){
      const opts=openDirs(p.r,p.c).filter(d=>d!==(p.dir^1));
      if(opts.length)p.dir=opts[0];else{p.prog=0;break}
    }
  }
}
function updateGhost(g,dt){
  if(g.decide){ghostPick(g);g.decide=false}
  if(!nextOpen(g.r,g.c,g.dir)){
    const opts=openDirs(g.r,g.c);
    if(!opts.length){g.prog=0;return}
    g.dir=opts[0];
    if(!nextOpen(g.r,g.c,g.dir)){g.prog=0;return}
  }
  g.prog+=dt/g.speed;
  if(g.prog>=1){g.prog-=1;g.r+=DR[g.dir];g.c+=DC[g.dir];g.decide=true}
}
function ghostPick(g){
  const opts=openDirs(g.r,g.c);if(!opts.length)return;
  let cand=opts.filter(d=>d!==(g.dir^1));
  if(!cand.length)cand=opts;
  if(Math.random()<cfg().chase&&PAC.pac){
    let best=cand[0],bd=1e9;
    cand.forEach(d=>{
      const dd=Math.abs(g.r+DR[d]-PAC.pac.r)+Math.abs(g.c+DC[d]-PAC.pac.c);
      if(dd<bd){bd=dd;best=d}
    });
    g.dir=best;
  }else g.dir=cand[Math.floor(Math.random()*cand.length)];
}
function arrivePac(){
  const p=PAC.pac,key=p.r+','+p.c;
  if(PAC.grid[p.r][p.c]==='.'&&!PAC.eaten.has(key)){
    PAC.eaten.add(key);PAC.dotsEaten++;PAC.score+=2;sfx.chomp();paintLives();
  }
  const slot=PAC.orbs[key];
  if(slot!==undefined&&!PAC.dead[key]){
    const r=PAC.questions[PAC.lvl];
    if(slot===PAC.okIndex)winLevel(r);
    else{
      PAC.dead[key]=true;PAC.lives--;markSlot(slot,'dead');paintLives();sfx.bad();
      const box=PAC.cv.parentNode;box.classList.add('shake');setTimeout(()=>box.classList.remove('shake'),420);
      if(PAC.lives<=0)gameOver(r);
      else{
        PAC.over=true;
        showFeedback(false,r,'Comiste la esfera <b style="color:'+PAC.colors[slot].c+'">'+LETTERS[slot]+'</b>: "'+esc(PAC.answers[slot].txt)+'". Pierdes 1 vida ❤️');
      }
    }
  }
}
function showFeedback(ok,r,extra){
  PAC.over=true;
  const o=$('#pOverlay');o.style.display='grid';
  o.innerHTML='<div class="oc pop"><div style="font-size:52px">'+(ok?'🎉':'💥')+'</div>'+
   '<h3 class="f" style="color:'+(ok?'#3ddc84':'#ff6b6b')+';margin:6px 0">'+(ok?'¡Respuesta correcta!':'¡Esa esfera no era!')+'</h3>'+
   '<p style="color:#dbe6fb;font-size:14px;line-height:1.55;margin:0 0 8px">'+(extra||'')+'</p>'+
   '<div class="box '+(ok?'tip':'warn')+'" style="text-align:left;font-size:13.5px;color:#22304d"><b>PIX te explica:</b> '+r.why+'</div>'+
   (ok?'<button class="btn teal" onclick="nextLevel()">Siguiente nivel ▶</button>'
     :'<button class="btn coral" onclick="respawn()">Seguir jugando (vidas: '+PAC.lives+')</button>')+
   '</div>';
}
function respawn(){
  if(!PAC)return;
  PAC.over=false;
  PAC.pac={r:START.r,c:START.c,dir:3,buffer:null,prog:0,speed:cfg().ps};
  PAC.ghosts=PAC.ghosts.map((g,i)=>({r:GHOST_HOME[i][0],c:GHOST_HOME[i][1],dir:(i%2===0?3:2),prog:0,
    speed:g.speed,color:g.color,decide:true}));
  PAC.freeze=1300;PAC.want=3;
  $('#pOverlay').style.display='none';
}
function winLevel(r){
  PAC.score+=40;paintLives();
  PAC.marks[PAC.lvl]='win';paintLvlStrip();
  markSlot(PAC.okIndex,'right');
  const nl=PAC.lvl+1;

  else sfx.up();

  }

   '<h3 class="f" style="color:#3ddc84;margin:6px 0">¡Nivel '+(PAC.lvl+1)+' superado!</h3>'+
   '<p style="color:#dbe6fb;font-size:14px;margin:0 0 8px">Comiste la esfera <b style="color:'+PAC.colors[slot].c+'">'+LETTERS[slot]+'</b> · +40 puntos · Vidas: '+PAC.lives+' ❤️</p>'+
   '<div class="box tip" style="text-align:left;font-size:13.5px;color:#0b5d50"><b>PIX te explica:</b> '+r.why+'</div>'+bonus+
   (nxt?'<button class="btn teal" onclick="nextLevel()">Ir al nivel '+(PAC.lvl+2)+' ▶</button>':'')+

function nextLevel(){

function hitGhost(){
  if(PAC.over||PAC.runOver)return;

  const box=PAC.cv.parentNode;box.classList.add('shake');setTimeout(()=>box.classList.remove('shake'),420);

     '<p style="color:#dbe6fb;font-size:14px">Te quedan '+PAC.lives+' vida(s). Usa los pasillos largos y no te quedes quieto en las esquinas.</p>'+
     '<button class="btn coral" onclick="respawn()">Continuar ▶</button></div>';

/* ---------- dibujo ---------- */
function draw(){
  const ctx=PAC.ctx,W=MW*CELL,H=MH*CELL,g=PAC.grid;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#060b1c';ctx.fillRect(0,0,W,H);
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
    if(g[r][c]==='#'){
      ctx.fillStyle='#16305e';ctx.beginPath();ctx.roundRect(c*CELL+2,r*CELL+2,CELL-4,CELL-4,7);ctx.fill();
      ctx.strokeStyle='#2f6fd0';ctx.lineWidth=1.5;ctx.stroke();
    }
  }
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
    if(g[r][c]==='.'&&!PAC.eaten.has(r+','+c)){
      ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(c*CELL+CELL/2,r*CELL+CELL/2,3.1,0,7);ctx.fill();
    }
  }
  const pulse=1+Math.sin(PAC.tick/220)*0.12;
  const hinting=PAC.hintSlot!=null&&PAC.tick<PAC.hintUntil;
  ORB_CELLS.forEach((cell,slot)=>{
    const key=cell[0]+','+cell[1],x=cell[1]*CELL+CELL/2,y=cell[0]*CELL+CELL/2;
    if(PAC.dead[key]){
      ctx.fillStyle='#3a1a26';ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();
      ctx.strokeStyle='#ff6b6b';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-6,y-6);ctx.lineTo(x+6,y+6);ctx.moveTo(x+6,y-6);ctx.lineTo(x-6,y+6);ctx.stroke();
      return;
    }
    const col=PAC.colors[slot]?PAC.colors[slot].c:'#ffd23f';
    const pr=(hinting&&slot===PAC.hintSlot)?1+Math.sin(PAC.tick/70)*0.28:pulse;
    ctx.save();ctx.shadowColor=col;ctx.shadowBlur=(hinting&&slot===PAC.hintSlot)?26:15;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,12.5*pr,0,7);ctx.fill();ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,12.5*pr,0,7);ctx.stroke();
    ctx.fillStyle='#12203a';ctx.font='bold 14px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(LETTERS[slot],x,y+1);
  });
  PAC.ghosts.forEach(gh=>{
    const p=posOf(gh);
    ctx.save();ctx.translate(p.x,p.y);
    ctx.fillStyle=gh.color;ctx.beginPath();ctx.arc(0,-3,11,Math.PI,0);ctx.lineTo(11,9);
    for(let i=0;i<4;i++){ctx.lineTo(11-i*5.5-2.75,5);ctx.lineTo(11-(i+1)*5.5,9)}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-5,3.6,0,7);ctx.arc(4,-5,3.6,0,7);ctx.fill();
    ctx.fillStyle='#12203a';
    const dx=DC[gh.dir==null?0:gh.dir]*1.6,dy=DR[gh.dir==null?0:gh.dir]*1.6;
    ctx.beginPath();ctx.arc(-4+dx,-5+dy,1.9,0,7);ctx.arc(4+dx,-5+dy,1.9,0,7);ctx.fill();
    ctx.restore();
  });
  const p=posOf(PAC.pac),d=(PAC.pac.dir==null)?0:PAC.pac.dir;
  const ang=[-Math.PI/2,Math.PI/2,Math.PI,0][d];
  const mouth=0.26+Math.abs(Math.sin(PAC.tick/90))*0.3;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);
  ctx.shadowColor='#ffd23f';ctx.shadowBlur=14;
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,0,12,mouth*Math.PI,2*Math.PI-mouth*Math.PI);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#12203a';ctx.beginPath();ctx.arc(3,-6,1.8,0,7);ctx.fill();
  ctx.restore();
  if(!PAC.started)return;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(PAC.freeze>0&&!PAC.over&&!PAC.runOver){
    ctx.fillStyle='rgba(6,11,28,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Fredoka, sans-serif';
    ctx.fillText('Nivel '+(PAC.lvl+1)+' · ¡Prepárate! '+Math.ceil(PAC.freeze/1000),W/2,H/2);
  }
  if(PAC.paused&&!PAC.over&&!PAC.runOver){
    ctx.fillStyle='rgba(6,11,28,.72)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd23f';ctx.font='bold 28px Fredoka, sans-serif';
    ctx.fillText('⏸ PAUSA',W/2,H/2);
  }
}
function markDone(key,stars,xp,msg){
  const prev=S.done[key]||0;
  if(stars>prev)S.done[key]=stars;
  save();paintTop();addXP(xp,msg||'');
}

        $$('#clF .opt').forEach(b2=>b2.onclick=()=>{

          else{b2.classList.add('no');sfx.bad();streak=0;

        });
      }else{b.classList.add('no');sfx.bad();streak=0;setTimeout(()=>b.classList.remove('no'),600)}

}

function startTrees(){
  let ti=0;
  function render(){
    if(ti>=TREES.length){
      $('#g3area').innerHTML='<div class="game" style="text-align:center"><div class="starsrow">⭐⭐⭐</div>'+
       '<h3 class="f" style="color:#fff">¡Los 3 árboles completados!</h3>'+
       '<p class="lead" style="color:#b9c9e8">Ya sabes trazar causa → efecto → daño social.</p>'+
       '<button class="btn teal" onclick="startTrees()">Repetir 🔁</button></div>';
      markDone('m3b',3,100,'Árboles de impacto completados');sfx.win();return;
    }
    const T=TREES[ti];
    const arr=(window._tree&&window._tree.i===ti)?window._tree.arr:shuffle(T.steps.map((s,i)=>({s,i})));
    window._tree={i:ti,arr:arr};
    $('#g3area').innerHTML='<div class="game"><span class="pill" style="background:rgba(23,195,178,.22);color:#5ff0e0">🌳 Árbol '+(ti+1)+'/'+TREES.length+' · '+T.title+'</span>'+
     '<h3 class="f" style="margin-top:8px">Ordena la cadena de impacto</h3>'+
     '<p class="lead" style="color:#b9c9e8;font-size:13.6px">Usa ▲▼ para ordenar de la causa a la consecuencia final.</p>'+
     '<div id="trList"></div><div class="row"><button class="btn teal" onclick="checkTree()">Comprobar</button><span id="trOut" class="small"></span></div></div>';
    paintList();
  }
  window.checkTree=()=>{
    const T=TREES[window._tree.i];
    const good=window._tree.arr.every((o,k)=>o.i===k);
    if(good){$('#trOut').innerHTML='<b style="color:#5ff0e0"> ¡Árbol correcto! 🌳</b><br><span style="color:#ffd23f">Lección: '+T.lesson+'</span>';
      sfx.ok();ti++;setTimeout(render,2400)}
    else{$('#trOut').innerHTML='<b style="color:#ff9f9f"> Todavía no: revisa qué viene primero.</b>';sfx.bad()}
  };
  function paintList(){
    $('#trList').innerHTML=window._tree.arr.map((o,k)=>'<div class="stepchip"><div class="n">'+(k+1)+'</div><div style="flex:1">'+o.s+'</div>'+
      '<button class="btn sm ghost" style="background:#eef3ff;color:#12203a" onclick="mvTree('+k+',-1)">▲</button>'+
      '<button class="btn sm ghost" style="background:#eef3ff;color:#12203a" onclick="mvTree('+k+',1)">▼</button></div>').join('');
  }
  window.mvTree=(k,d)=>{const a=window._tree.arr,j=k+d;if(j<0||j>=a.length)return;const t=a[k];a[k]=a[j];a[j]=t;sfx.click();paintList()};
  render();
}

    <h2 class="sec f" style="color:#fff">🏅 Tus logros</h2>
    <p class="lead">${esc(S.name||'Guardián')} · Nivel: <b style="color:#ffd23f">${level()[1]}</b> · ${S.xp} XP · ${st} estrellas</p>
    <div>${badges.map(b=>'<div class="badge '+(S.done[b.k]?'':'off')+'" title="'+b.n+'">'+b.e+'</div>').join('')}
    ${['m1','m2','m3','m4'].map(k=>'<div class="badge '+(S.missions[k]?'':'off')+'" title="Misión '+k.toUpperCase()+'">📜</div>').join('')}</div>
  </div>
  ${allMissions?`<div class="cert" style="margin-top:20px">
    <div style="max-width:170px;margin:0 auto">${ART.medal}</div>
    <h2 class="f" style="margin:8px 0 2px;font-size:30px">Diploma de Ciudadanía Digital</h2>
    <p style="font-size:16px;margin:4px 0">Se otorga a</p>
    <h3 class="f" style="font-size:28px;margin:2px 0 8px;border-bottom:2px solid #d4a72c;display:inline-block;padding:0 24px">${esc(S.name||'____________')}</h3>
    <p style="max-width:620px;margin:8px auto;font-size:14.5px;line-height:1.6">Por completar los cuatro módulos del taller <b>Guardianes de la Red</b>: arquitectura de plataformas, netiqueta y privacidad, impacto socioeconómico del ecosistema digital y soberanía de datos; y por redactar, caligrafiar y jurar su propio Decálogo del Ciudadano Digital.</p>
    <p style="font-size:13px">Fecha: ${new Date().toLocaleDateString('es',{year:'numeric',month:'long',day:'numeric'})} · Estrellas: ${st}/15 · XP: ${S.xp}</p>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn" onclick="printCert()">🖨️ Imprimir diploma</button>
      <button class="btn teal" onclick="go('home')">🗺️ Volver al mapa</button></div></div>`
  :`<div class="card" style="margin-top:20px;text-align:center">
    <h3 class="f" style="margin:0 0 6px">El diploma se desbloquea al completar las 4 misiones 📜</h3>
    <p class="lead">${['m1','m2','m3','m4'].map((k,i)=>'<span class="pill" style="background:'+(S.missions[k]?'#dcffe9':'#ffe6e6')+';color:'+(S.missions[k]?'#166b3a':'#a02c2c')+'">Módulo '+(i+1)+': '+(S.missions[k]?'✔ lista':'pendiente')+'</span>').join(' ')}</p>
    <button class="btn teal" onclick="go('home')">🗺️ Ir al mapa</button></div>`}`;
}
function printCert(){
  doPrint('<div style="text-align:center;border:8px double #d4a72c;padding:30px"><h1>Diploma de Ciudadanía Digital</h1>'+
   '<p>Taller <b>Guardianes de la Red</b></p><h2 style="margin:20px 0">'+esc(S.name||'____________')+'</h2>'+
   '<p style="max-width:520px;margin:0 auto">Por completar los cuatro módulos del taller y por redactar y jurar su Decálogo del Ciudadano Digital.</p>'+
   '<p style="margin-top:26px">Fecha: '+new Date().toLocaleDateString('es')+' · Estrellas: '+totalStars()+'/15 · XP: '+S.xp+'</p>'+
   '<p style="margin-top:50px">Firma del estudiante: ____________________ &nbsp;&nbsp; Firma del docente: ____________________</p></div>');
}

/* ---------- init ---------- */
paintTop();
go('home');
if(!S.name){setTimeout(()=>modal('<div style="text-align:center">'+ART.robot+
  '<h3 class="f">¡Bienvenido/a al taller!</h3>'+
  '<p class="lead">Soy <b>PIX</b>, tu robot guía. Vamos a descubrir cómo están construidas las redes por dentro… y cómo protegerte de sus trampas.</p>'+
  '<input type="text" id="nm2" placeholder="Escribe tu nombre" style="margin-bottom:10px">'+
  '<button class="btn teal" onclick="S.name=(document.getElementById(\'nm2\').value.trim()||\'Guardián\');save();closeModal();toast(\'¡Hola, \'+esc(S.name)+\'! 🛡️\');go(\'home\')">¡Empezar! 🚀</button></div>'),600)}
</script>
