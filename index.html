<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardianes de la Red · Taller interactivo (10-13 años)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka@5.0.13/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fredoka@5.0.13/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.13/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.13/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.13/900.css">
<style>
:root{
  --navy:#0d1830; --navy2:#152748; --navy3:#1d3560;
  --ink:#12203a; --muted:#5d6e8a;
  --teal:#17c3b2; --tealD:#0f9c8e;
  --coral:#ff6b6b; --coralD:#e04f4f;
  --yellow:#ffd23f; --yellowD:#e0b31f;
  --purple:#8b5cf6; --sky:#4cc9f0; --green:#3ddc84; --greenD:#28b468;
  --paper:#ffffff; --paper2:#f4f8ff;
  --r:20px; --shadow:0 10px 0 rgba(0,0,0,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:#eaf1ff; min-height:100vh;
  background:
    radial-gradient(1000px 520px at 12% -8%, #23457a 0%, transparent 60%),
    radial-gradient(800px 480px at 92% 4%, #1b6f74 0%, transparent 55%),
    linear-gradient(180deg,#0d1830 0%,#111f3c 45%,#0a1426 100%);
  background-attachment:fixed;
}
h1,h2,h3,h4,.f{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:700;letter-spacing:.2px}
button{font-family:'Fredoka','Nunito',sans-serif}
::selection{background:var(--yellow);color:#12203a}
#stars-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
#stars-bg i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:14px 16px 90px}

/* ---------- TOPBAR ---------- */
#topbar{position:sticky;top:0;z-index:60;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(9,17,34,.95),rgba(9,17,34,.72));
  border-bottom:2px solid rgba(255,255,255,.08)}
.tb{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.tb .logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.tb .logo svg{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tb .logo b{font-family:'Fredoka';font-size:19px;line-height:1;display:block;color:#fff}
.tb .logo span{font-size:11px;color:#9fb4d8;letter-spacing:.6px;text-transform:uppercase}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.14);
  padding:6px 12px;border-radius:999px;font-weight:900;font-size:13px;color:#fff;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.chip.gold{background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#3a2600;border-color:#ffe9a8}
.xpwrap{min-width:150px}
.xpbar{height:9px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sky),var(--yellow));border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.2,1)}
.xpwrap small{font-size:10.5px;color:#a9bde0;letter-spacing:.4px}

/* ---------- GENERIC ---------- */
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card.soft{background:var(--paper2)}
.card.dark{background:linear-gradient(160deg,#182c52,#101d38);color:#e8f0ff;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:none;cursor:pointer;padding:12px 20px;border-radius:16px;font-size:15px;font-weight:700;color:#12203a;
  background:var(--yellow);box-shadow:0 5px 0 var(--yellowD);transition:.08s;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellowD)}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 var(--tealD);color:#04231f}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coralD);color:#fff}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 #6b3fd1;color:#fff}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-weight:900;font-size:12px;letter-spacing:.3px}
.tag{background:#e8f0ff;color:#28447a;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:800;display:inline-block}
h2.sec{font-size:clamp(20px,3.4vw,30px);margin:0 0 4px}
.lead{color:#4a5c7a;margin:0 0 14px;font-size:15px;line-height:1.6}
.dark .lead{color:#b9c9e8}
hr.sep{border:none;border-top:2px dashed rgba(18,32,58,.14);margin:18px 0}
.dark hr.sep{border-color:rgba(255,255,255,.16)}
ul.tick{list-style:none;padding:0;margin:8px 0}
ul.tick li{padding:7px 0 7px 32px;position:relative;line-height:1.5;font-size:14.5px;color:#33415e}
ul.tick li:before{content:"✔";position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;
  background:#e3fff6;color:var(--tealD);font-size:12px;display:grid;place-items:center;font-weight:900}
.dark ul.tick li{color:#dbe6fb}
.dark ul.tick li:before{background:rgba(23,195,178,.2);color:#5ff0e0}
.box{border-radius:16px;padding:14px 16px;margin:12px 0;font-size:14.5px;line-height:1.6}
.box.tip{background:#e8fbf6;border-left:6px solid var(--teal)}
.box.warn{background:#fff1f1;border-left:6px solid var(--coral)}
.box.note{background:#fff8e1;border-left:6px solid var(--yellow)}
.box.info{background:#eef3ff;border-left:6px solid var(--sky)}
.dark .box.tip{background:rgba(23,195,178,.14);color:#dffaf3}
.dark .box.warn{background:rgba(255,107,107,.14);color:#ffe2e2}
.dark .box.note{background:rgba(255,210,63,.14);color:#fff5d4}
.dark .box.info{background:rgba(76,201,240,.14);color:#dff3ff}
.box b{font-family:'Fredoka'}
.illus{width:100%;height:auto;display:block;border-radius:16px}
.artframe{background:linear-gradient(160deg,#f7fbff,#e9f2ff);border-radius:18px;padding:10px;border:2px dashed #c9dcf5}
.dark .artframe{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center;
  background:linear-gradient(135deg,rgba(23,195,178,.2),rgba(139,92,246,.22));border:2px solid rgba(255,255,255,.16);
  border-radius:28px;padding:24px;margin-bottom:22px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(26px,5vw,46px);line-height:1.05;margin:0 0 10px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.hero p{color:#d6e4ff;font-size:16px;line-height:1.6;margin:0 0 14px}
.namebox{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],textarea,select{font-family:'Nunito';font-size:15px;padding:11px 14px;border-radius:14px;border:2px solid #cfdcf2;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(23,195,178,.2)}
.dark input[type=text],.dark textarea,.dark select{background:rgba(255,255,255,.95)}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.mod{background:var(--paper);color:var(--ink);border-radius:24px;padding:0;overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;transition:.22s;border:3px solid transparent;text-align:left;display:block;width:100%}
.mod:hover{transform:translateY(-6px) rotate(-.5deg);border-color:var(--yellow)}
.mod .top{padding:16px 18px;color:#fff;position:relative;overflow:hidden;min-height:118px}
.mod .top svg{position:absolute;right:-8px;bottom:-8px;width:120px;opacity:.95}
.mod .num{font-family:'Fredoka';font-size:12px;letter-spacing:2px;opacity:.9}
.mod h3{margin:2px 0 0;font-size:20px;line-height:1.15;max-width:62%}
.mod .body{padding:14px 18px 18px}
.mod .body p{font-size:13.5px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;color:var(--ink);
  background:conic-gradient(var(--teal) calc(var(--p)*1%), #e6edf9 0)}
.ring span{background:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}

/* ---------- MODULE ---------- */
.modhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.modhead .big{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px;flex:0 0 auto;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tabs{display:flex;gap:8px;background:rgba(255,255,255,.08);padding:6px;border-radius:99px;margin-bottom:18px;flex-wrap:wrap;border:2px solid rgba(255,255,255,.12)}
.tab{flex:1;min-width:110px;border:none;background:transparent;color:#c9d8f5;padding:11px 14px;border-radius:99px;cursor:pointer;font-size:14.5px;font-weight:700;transition:.2s}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.acc{border-radius:18px;background:#fff;color:var(--ink);margin-bottom:12px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.acc>button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:none;padding:16px 18px;cursor:pointer;text-align:left;font-size:16.5px;font-weight:700;font-family:'Fredoka';color:var(--ink)}
.acc>button .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.acc>button .ar{margin-left:auto;transition:.25s;color:#94a6c4}
.acc.open>button .ar{transform:rotate(90deg)}
.acc .in{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc.open .in{max-height:4000px}
.acc .pad{padding:0 18px 18px}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.flip{perspective:900px;height:170px;cursor:pointer}
.flip .in2{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in2{transform:rotateY(180deg)}
.flip .fc,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:center}
.flip .fc{background:linear-gradient(150deg,#1e3a68,#16294a);color:#fff;border:2px solid rgba(255,255,255,.14)}
.flip .bk{transform:rotateY(180deg);background:#fff;color:var(--ink);border:2px solid #dbe6f7;font-size:13.2px;line-height:1.45;overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.4px;background:#fff;border-radius:14px;overflow:hidden}
table.tbl th{background:var(--ink);color:#fff;padding:10px 8px;text-align:left;font-family:'Fredoka';font-weight:600;font-size:12.6px}
table.tbl td{padding:9px 8px;border-bottom:1px solid #eaf0fa;color:#31415e;vertical-align:top}
table.tbl tr:nth-child(even) td{background:#f8fbff}
table.tbl tr:hover td{background:#eefaf7}
.scrollx{overflow-x:auto;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}

/* ---------- GAMES ---------- */
.game{background:linear-gradient(160deg,#16294a,#0e1a33);border-radius:24px;padding:18px;border:2px solid rgba(255,255,255,.12);color:#eaf1ff}
.game h3{margin:0 0 6px;font-size:22px;color:#fff}
.qbar{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:3px solid transparent;border-radius:16px;
  padding:13px 16px;margin-bottom:10px;cursor:pointer;font-size:15px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:.12s}
.opt:hover{transform:translateY(-2px);border-color:var(--sky)}
.opt.ok{background:#e2fff0;border-color:var(--green);box-shadow:0 5px 0 var(--greenD)}
.opt.no{background:#ffe9e9;border-color:var(--coral);box-shadow:0 5px 0 var(--coralD)}
.opt.dis{opacity:.6;cursor:not-allowed}
canvas#pac{display:block;width:100%;max-width:630px;margin:0 auto;border-radius:14px;background:#060b1c;
  border:3px solid #2b4d8f;image-rendering:pixelated;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px;justify-content:center;margin:12px auto 0;user-select:none}
.dpad button{border:none;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.dpad button:active{background:var(--teal);color:#04231f;transform:translateY(3px);box-shadow:none}
.hearts{font-size:20px;letter-spacing:2px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,12,30,.86);border-radius:20px;z-index:5;padding:18px;text-align:center}
.overlay .oc{max-width:420px}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pbar{height:12px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));width:0;transition:width .4s}
.starsrow{font-size:34px;letter-spacing:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.16);font-size:14px}
.drag{background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14px;font-weight:800;cursor:pointer;
  border-left:6px solid var(--sky);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:.15s}
.drag:hover{transform:translateX(4px)}
.drag.sel{border-left-color:var(--yellow);background:#fffbe8}
.drag.done{opacity:.42;border-left-color:var(--green);text-decoration:line-through}
.dropz{border:3px dashed rgba(255,255,255,.28);border-radius:16px;padding:12px;min-height:70px;margin-bottom:10px;transition:.2s}
.dropz:hover{border-color:var(--yellow);background:rgba(255,210,63,.07)}
.dropz.hit{border-color:var(--green);background:rgba(61,220,132,.12)}
.stepchip{display:flex;gap:10px;align-items:flex-start;background:#fff;color:var(--ink);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.stepchip .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.zone{border-radius:14px;padding:12px;font-size:13.5px;font-weight:800;cursor:pointer;border:3px solid transparent;transition:.2s;text-align:center}
.zone.on{transform:scale(1.04);border-color:#fff}
.count{font-weight:900;font-size:13px;padding:4px 10px;border-radius:99px;background:#eef3ff;color:#2c4a80}
.count.good{background:#dcffe9;color:#166b3a}
.count.bad{background:#ffe6e6;color:#a02c2c}
.mapnode{border-radius:14px;padding:8px 12px;margin:6px 0;font-size:13.5px;font-weight:800;color:#fff;display:flex;gap:8px;align-items:center}
.mapnode button{margin-left:auto;background:rgba(0,0,0,.2);border:none;color:#fff;border-radius:8px;cursor:pointer;padding:2px 8px}
.mindmap{position:relative;background:radial-gradient(circle at 50% 30%,#fff,#eef4ff);border-radius:18px;padding:18px;color:var(--ink)}
.mmcenter{width:150px;height:150px;border-radius:50%;background:linear-gradient(150deg,var(--purple),#5b34c9);color:#fff;display:grid;place-items:center;
  text-align:center;padding:14px;margin:0 auto;font-family:'Fredoka';font-size:14px;box-shadow:0 8px 0 rgba(0,0,0,.16);z-index:2;position:relative}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.branch{border-radius:16px;padding:12px;color:#fff;min-height:120px}
.branch h4{margin:0 0 8px;font-size:15px}
.cert{background:linear-gradient(160deg,#fffdf5,#fff6dd);color:#3a2c00;border:6px double #d4a72c;border-radius:20px;padding:28px;text-align:center}
.badge{display:inline-grid;place-items:center;width:74px;height:74px;border-radius:50%;background:linear-gradient(150deg,#ffd23f,#ff9f1c);
  box-shadow:0 6px 0 #b9781a;font-size:30px;margin:4px}
.badge.off{background:#2a3a5c;box-shadow:0 6px 0 #1b2740;filter:grayscale(1);opacity:.5}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);z-index:200;background:#12203a;color:#fff;
  padding:13px 22px;border-radius:99px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.35s;border:2px solid rgba(255,255,255,.2);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(4,10,24,.8);z-index:300;display:none;place-items:center;padding:18px}
#modal.on{display:grid}
#modal .mc{background:#fff;color:var(--ink);border-radius:22px;padding:24px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s}
.flow{display:flex;flex-direction:column;gap:0}
.fstep{display:flex;gap:12px;align-items:flex-start}
.fstep .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 auto;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.fstep .ln{width:4px;height:24px;background:#d6e2f5;margin-left:17px}
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cyc{background:#fff;border-radius:14px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer;border-top:6px solid var(--sky);transition:.2s}
.cyc:hover{transform:translateY(-4px)}
.cyc b{display:block;font-family:'Fredoka';font-size:14px;margin-bottom:4px;color:var(--ink)}
.cyc small{color:#5d6e8a;font-size:12.4px;line-height:1.45;display:block}
.hotspot{position:absolute;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:12px;cursor:pointer;
  border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:beat 2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:800;color:#c9d8f5;margin-top:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-2px}
.fab{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.fab button{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.small{font-size:12.5px;color:var(--muted)}
.dark .small{color:#9fb4d8}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.12);font-size:14px;color:var(--ink);font-weight:700;border-left:6px solid #dfe8f7}
.chk.on{border-left-color:var(--green);background:#f2fff7}
.chk .bx{width:24px;height:24px;border-radius:8px;border:3px solid #c6d5ec;flex:0 0 auto;display:grid;place-items:center;font-size:13px;color:transparent}

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function roundRectPath(x,y,w,h,r){return `M${x+r},${y}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}v${h-2*r}a${r},${r} 0 0 1 -${r},${r}h-${w-2*r}a${r},${r} 0 0 1 -${r},-${r}v-${h-2*r}a${r},${r} 0 0 1 ${r},-${r}z`}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

/* ---------- sonido ---------- */
let AC=null, SOUND=true;
function beep(f,d,type='square',v=.06){
  if(!SOUND)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(AC.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);
  }catch(e){}
}
const sfx={
  chomp:()=>beep(420,.05,'square',.045),
  ok:()=>{beep(660,.09);setTimeout(()=>beep(880,.12),90)},
  bad:()=>{beep(180,.22,'sawtooth',.07)},
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.08),i*110))},
  click:()=>beep(300,.03,'sine',.04),
  star:()=>{[880,1174].forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle',.07),i*90))}
};
function toggleSound(){SOUND=!SOUND;$('#chipSound').textContent=SOUND?'🔊':'🔇';toast(SOUND?'Sonido activado 🔊':'Sonido apagado 🔇')}

  m3:{map:{op:[],de:[],sm:[],co:[]},topic:'',checks:[]},

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const LEVELS=[[0,'Explorador/a'],[200,'Navegante'],[450,'Analista de Interfaces'],[750,'Detective de Datos'],[1100,'Guardián de la Red'],[1500,'Maestro/a Ciudadano/a']];
function level(){let l=LEVELS[0];for(const x of LEVELS){if(S.xp>=x[0])l=x}return l}
function addXP(n,msg){S.xp+=n;save();paintTop();toast((msg||'')+' +'+n+' XP ⚡')}
function totalStars(){return Object.values(S.done).reduce((a,b)=>a+(b||0),0)+Object.values(S.missions).filter(Boolean).length*2}
function paintTop(){
  const l=level();const idx=LEVELS.findIndex(x=>x[0]===l[0]);const nxt=LEVELS[idx+1];
  $('#lvlName').textContent=l[1];$('#xpNum').textContent=S.xp;$('#starCount').textContent=totalStars();
  const base=l[0],top=nxt?nxt[0]:l[0]+400;
  $('#xpFill').style.width=Math.min(100,((S.xp-base)/(top-base))*100)+'%';
  $('#xpNext').textContent=nxt?('Faltan '+(top-S.xp)+' XP para: '+nxt[1]):'¡Nivel máximo alcanzado! 🏆';
  $('#chipSound').textContent=SOUND?'🔊':'🔇';
}

let CURRENT={v:'home',mod:1,tab:'learn'};
let CLEANUP=null;
function go(v,p){
  if(CLEANUP){try{CLEANUP()}catch(e){}CLEANUP=null}
  CURRENT={v:v,mod:(p&&p.mod)||CURRENT.mod,tab:(p&&p.tab)||'learn'};
  window.scrollTo({top:0,behavior:'smooth'});
  const view=$('#view');view.innerHTML='';
  if(v==='home')renderHome(view);
  else if(v==='module')renderModule(view,CURRENT.mod,CURRENT.tab);
  else if(v==='diploma')renderDiploma(view);
  view.classList.remove('pop');void view.offsetWidth;view.classList.add('pop');
}
function modProgress(n){
  const acts=['m'+n+'a','m'+n+'b','mission'+n];
  let c=0;acts.forEach(k=>{if(S.done[k]||S.missions['m'+n])c++});
  return Math.round(c/acts.length*100);
}

function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

let PAC=null;
function startPac(){
  const cv=$('#pac');if(!cv)return;
  const ctx=cv.getContext('2d');
  const rounds=shuffle(PAC_QUESTIONS).slice(0,5);
  PAC={
    cv,ctx,round:0,lives:3,score:0,paused:false,over:false,eaten:new Set(),
    letters:['A','B','C','D'],order:[],orbs:{},raf:null,last:0,freeze:0,tick:0
  };
  const keyH=e=>{
    const k=e.key.toLowerCase();
    let d=null;
    if(k==='arrowup'||k==='w')d=0;else if(k==='arrowdown'||k==='s')d=1;
    else if(k==='arrowleft'||k==='a')d=2;else if(k==='arrowright'||k==='d')d=3;
    else if(k===' '){PAC.paused=!PAC.paused;paintOverlayBtn();e.preventDefault();return}
    if(d!==null){PAC.want=d;e.preventDefault()}
  };
  document.addEventListener('keydown',keyH);
  $$('.dpad button[data-d]').forEach(b=>{
    const f=e=>{e.preventDefault();PAC.want=parseInt(b.dataset.d)};
    b.addEventListener('touchstart',f,{passive:false});b.addEventListener('mousedown',f);
  });
  $('#pPause').onclick=()=>{PAC.paused=!PAC.paused;paintOverlayBtn()};
  let tS=null;
  cv.addEventListener('touchstart',e=>{const t=e.touches[0];tS={x:t.clientX,y:t.clientY}},{passive:true});
  cv.addEventListener('touchend',e=>{
    if(!tS)return;const t=e.changedTouches[0];const dx=t.clientX-tS.x,dy=t.clientY-tS.y;
    if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
    PAC.want=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?1:0);tS=null;
  },{passive:true});
  CLEANUP=()=>{document.removeEventListener('keydown',keyH);if(PAC&&PAC.raf)cancelAnimationFrame(PAC.raf);PAC=null};
  setupRound();
  PAC.last=performance.now();
  loop(PAC.last);
}
function setupRound(){
  const r=rounds_get(PAC.round);
  PAC.order=shuffle([0,1,2,3]);
  PAC.orbs={};
  ORB_CELLS.forEach((c,i)=>{PAC.orbs[c[0]+','+c[1]]=PAC.order[i]});
  PAC.dead={};
  PAC.eaten=new Set();
  PAC.pac={r:7,c:10,dir:3,want:3,prog:0,speed:135};
  PAC.ghosts=[{r:7,c:1,dir:3,prog:0,speed:225,color:'#ff6b6b',decide:true},
              {r:7,c:19,dir:2,prog:0,speed:240,color:'#8b5cf6',decide:true}];
  PAC.freeze=1200;
  $('#pq').innerHTML=`<b style="color:#ffd23f">Pregunta ${PAC.round+1}:</b> ${r.q}<br>
   <span class="small" style="color:#9fb4d8">Esferas: <b style="color:#fff">A</b> ${esc(r.a[PAC.order[0]])} · <b style="color:#fff">B</b> ${esc(r.a[PAC.order[1]])} · <b style="color:#fff">C</b> ${esc(r.a[PAC.order[2]])} · <b style="color:#fff">D</b> ${esc(r.a[PAC.order[3]])}</span>`;
  $('#pRound').textContent=PAC.round+1;
  paintLives();
}
function rounds_get(i){return PAC._rounds[i]}
function paintLives(){$('#pLives').textContent='❤️'.repeat(Math.max(0,PAC.lives))+'🖤'.repeat(Math.max(0,3-PAC.lives));$('#pScore').textContent=PAC.score}
function paintOverlayBtn(){$('#pPause').textContent=PAC.paused?'▶':'⏸'}
function wall(r,c){return r<0||c<0||r>=MH||c>=MW||MAZE[r][c]==='#'}
function openDirs(r,c){const o=[];for(let d=0;d<4;d++){if(!wall(r+DR[d],c+DC[d]))o.push(d)}return o}
function loop(ts){
  if(!PAC)return;
  const dt=Math.min(60,ts-PAC.last);PAC.last=ts;
  if(!PAC.paused&&!PAC.over){
    if(PAC.freeze>0)PAC.freeze-=dt;
    else{update(dt)}
    PAC.tick+=dt;
  }
  draw();
  PAC.raf=requestAnimationFrame(loop);
}
function update(dt){
  const p=PAC.pac;
  // dirección deseada
  if(p.want!==undefined&&p.want!==null&&!wall(p.r+DR[p.want],p.c+DC[p.want])&&p.prog<0.02)p.dir=p.want;
  if(wall(p.r+DR[p.dir],p.c+DC[p.dir])){
    if(p.want!==null&&!wall(p.r+DR[p.want],p.c+DC[p.want]))p.dir=p.want;
    else{const o=openDirs(p.r,p.c);p.dir=o.length?o[0]:null}
  }
  if(p.dir!==null&&p.dir!==undefined){
    p.prog+=dt/p.speed;
    while(p.prog>=1){p.prog-=1;p.r+=DR[p.dir];p.c+=DC[p.dir];arrivePac();
      if(wall(p.r+DR[p.dir],p.c+DC[p.dir])){break}}
  } else p.prog=0;
  // fantasmas
  PAC.ghosts.forEach(g=>{
    if(g.decide){
      const o=openDirs(g.r,g.c).filter(d=>d!==(g.dir^1)||o_single(g));
      const opts=openDirs(g.r,g.c);
      let cand=opts.filter(d=>!(d===(g.dir^1)));
      if(!cand.length)cand=opts;
      if(Math.random()<0.62){
        cand.sort((a,b)=>{
          const da=Math.abs(g.r+DR[a]-PAC.pac.r)+Math.abs(g.c+DC[a]-PAC.pac.c);
          const db=Math.abs(g.r+DR[b]-PAC.pac.r)+Math.abs(g.c+DC[b]-PAC.pac.c);
          return da-db});
        g.dir=cand[0];
      } else g.dir=cand[Math.floor(Math.random()*cand.length)];
      g.decide=false;
    }
    g.prog+=dt/g.speed;
    if(g.prog>=1){g.prog-=1;g.r+=DR[g.dir];g.c+=DC[g.dir];g.decide=true;
      if(wall(g.r+DR[g.dir],g.c+DC[g.dir])){const o=openDirs(g.r,g.c);g.dir=o[0];g.decide=true}}
  });
  // colisión
  const pp=posOf(PAC.pac);
  PAC.ghosts.forEach(g=>{const gp=posOf(g);
    if(Math.hypot(pp.x-gp.x,pp.y-gp.y)<CELL*0.62)hitGhost()});
}
function o_single(g){return openDirs(g.r,g.c).length===1}
function posOf(e){
  const d=(e.dir===null||e.dir===undefined)?0:e.dir;
  return {x:(e.c+DC[d]*(e.prog||0))*CELL+CELL/2,y:(e.r+DR[d]*(e.prog||0))*CELL+CELL/2};
}
function arrivePac(){
  const p=PAC.pac,key=p.r+','+p.c;
  if(MAZE[p.r][p.c]==='.'&&!PAC.eaten.has(key)){PAC.eaten.add(key);PAC.score+=2;sfx.chomp();$('#pScore').textContent=PAC.score}
  if(PAC.orbs[key]!==undefined&&!PAC.dead[key]){
    const r=rounds_get(PAC.round);
    if(PAC.orbs[key]===r.ok){winRound()}
    else{
      PAC.dead[key]=true;PAC.lives--;paintLives();sfx.bad();
      const box=PAC.cv.parentNode;box.classList.add('shake');setTimeout(()=>box.classList.remove('shake'),420);
      feedback(false,r,`Esa era: "${esc(r.a[PAC.orbs[key]])}"`);
      if(PAC.lives<=0)loseGame(r);
      else{PAC.pac={r:7,c:10,dir:3,want:3,prog:0,speed:135};
        PAC.ghosts[0]={r:7,c:1,dir:3,prog:0,speed:225,color:'#ff6b6b',decide:true};
        PAC.ghosts[1]={r:7,c:19,dir:2,prog:0,speed:240,color:'#8b5cf6',decide:true};
        PAC.freeze=1400}

  }
}

function draw(){
  const {ctx}=PAC;const W=MW*CELL,H=MH*CELL;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#060b1c';ctx.fillRect(0,0,W,H);
  // muros
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
    if(MAZE[r][c]==='#'){
      ctx.fillStyle='#16305e';
      ctx.beginPath();ctx.roundRect(c*CELL+2,r*CELL+2,CELL-4,CELL-4,7);ctx.fill();
      ctx.strokeStyle='#2f6fd0';ctx.lineWidth=1.6;ctx.stroke();
    }
  }
  // puntos
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
    if(MAZE[r][c]==='.'&&!PAC.eaten.has(r+','+c)){
      ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(c*CELL+CELL/2,r*CELL+CELL/2,3.1,0,7);ctx.fill();
    }
  }
  // esferas de respuesta
  const pulse=1+Math.sin(PAC.tick/220)*0.12;
  ORB_CELLS.forEach((cell,i)=>{
    const key=cell[0]+','+cell[1];
    const idx=PAC.orbs[key];
    const x=cell[1]*CELL+CELL/2,y=cell[0]*CELL+CELL/2;
    if(PAC.dead[key]){
      ctx.fillStyle='#4a2030';ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();
      ctx.strokeStyle='#ff6b6b';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-6,y-6);ctx.lineTo(x+6,y+6);ctx.moveTo(x+6,y-6);ctx.lineTo(x-6,y+6);ctx.stroke();
      return;
    }
    const cols=['#ffd23f','#4cc9f0','#3ddc84','#ff9f1c'];
    ctx.save();ctx.shadowColor=cols[idx];ctx.shadowBlur=16;
    ctx.fillStyle=cols[idx];ctx.beginPath();ctx.arc(x,y,12*pulse,0,7);ctx.fill();ctx.restore();
    ctx.fillStyle='#12203a';ctx.font='bold 14px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(PAC.letters[idx],x,y+1);
  });
  // fantasmas
  PAC.ghosts.forEach(g=>{
    const p=posOf(g);
    ctx.save();ctx.translate(p.x,p.y);
    ctx.fillStyle=g.color;
    ctx.beginPath();ctx.arc(0,-3,11,Math.PI,0);ctx.lineTo(11,9);
    for(let i=0;i<4;i++){ctx.lineTo(11-i*5.5-2.75,5);ctx.lineTo(11-(i+1)*5.5,9)}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-5,3.6,0,7);ctx.arc(4,-5,3.6,0,7);ctx.fill();
    ctx.fillStyle='#12203a';
    const dx=DC[g.dir||0]*1.6,dy=DR[g.dir||0]*1.6;
    ctx.beginPath();ctx.arc(-4+dx,-5+dy,1.9,0,7);ctx.arc(4+dx,-5+dy,1.9,0,7);ctx.fill();
    ctx.restore();
  });
  // pacman
  const p=posOf(PAC.pac);const d=PAC.pac.dir||0;
  const ang=[-Math.PI/2,Math.PI/2,Math.PI,0][d];
  const mouth=0.28+Math.abs(Math.sin(PAC.tick/90))*0.28;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);
  ctx.shadowColor='#ffd23f';ctx.shadowBlur=14;
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,0,12,mouth*Math.PI,2*Math.PI-mouth*Math.PI);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#12203a';ctx.beginPath();ctx.arc(3,-6,1.8,0,7);ctx.fill();
  ctx.restore();
  if(PAC.freeze>0&&!PAC.over){
    ctx.fillStyle='rgba(6,11,28,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px Fredoka, sans-serif';ctx.textAlign='center';
    ctx.fillText('¡Prepárate! '+Math.ceil(PAC.freeze/1000),W/2,H/2);
  }
  if(PAC.paused&&!PAC.over){
    ctx.fillStyle='rgba(6,11,28,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd23f';ctx.font='bold 26px Fredoka, sans-serif';ctx.textAlign='center';
    ctx.fillText('⏸ PAUSA',W/2,H/2);
  }
}

  const prev=S.done[key]||0;
  if(stars>prev){S.done[key]=stars}
  save();paintTop();addXP(xp,msg||'');

function startTribunal(){

      <div id="trA"></div>`;
    $$('#trV .opt').forEach(b=>b.onclick=()=>{

function startFunnel(){
  const items=shuffle(PRIV_ITEMS);let sel=null,ok=0,done={};
  const area=$('#g2area');
  area.innerHTML=`<div class="game"><span class="pill" style="background:rgba(23,195,178,.22);color:#5ff0e0">🪜 El embudo de la privacidad</span>

   <div class="grid g2" style="align-items:start">
     <div id="fnItems"></div><div id="fnZones"></div>
   </div><div id="fnOut"></div></div>`;
  function paint(){
    $('#fnItems').innerHTML=items.map((it,i)=>`<div class="drag ${done[i]?'done':''} ${sel===i?'sel':''}" data-i="${i}">${it.t}</div>`).join('');
    $$('#fnItems .drag').forEach(d=>d.onclick=()=>{if(done[d.dataset.i])return;sel=+d.dataset.i;sfx.click();paint()});
    $('#fnZones').innerHTML=PRIV_LEVELS.map((lv,i)=>`<div class="dropz" data-lv="${lv}">
      <div style="font-family:'Fredoka';font-weight:700;color:${['#ff6b6b','#ffd23f','#4cc9f0','#17c3b2'][i]}">${['🌍','👥','🤝','🔒'][i]} ${lv}</div>
      <div class="small" style="color:#9fb4d8">${['Cualquiera y los buscadores','Solo quien tú aceptaste','Tus contactos verificados','Nadie más que tú'][i]}</div></div>`).join('');
    $$('#fnZones .dropz').forEach(z=>z.onclick=()=>{
      if(sel===null){toast('Primero toca un dato 👆');return}
      const it=items[sel];
      if(z.dataset.lv===it.lv){done[sel]=true;ok++;z.classList.add('hit');sfx.ok();
        $('#fnOut').innerHTML=`<div class="box tip" style="color:#0b5d50"><b>¡Correcto!</b> ${it.t} → ${it.lv}</div>`;sel=null;setTimeout(paint,250)}
      else{z.classList.add('hit');setTimeout(()=>z.classList.remove('hit'),400);sfx.bad();
        $('#fnOut').innerHTML=`<div class="box warn" style="color:#7a2020">Piensa: ¿qué pasaría si un desconocido viera esto? Intenta otro nivel.</div>`}
      if(ok===items.length){
        const st=3;
        $('#fnOut').innerHTML=`<div style="text-align:center"><div class="starsrow">⭐⭐⭐</div>
         <h3 class="f" style="color:#fff">¡Embudo dominado!</h3>
         <button class="btn teal" onclick="startFunnel()">Otra vez 🔁</button></div>`;
        markDone('m2b',st,90,'Embudo de privacidad completado');sfx.win();
      }
    });
  }
  paint();
}

function startTrees(){
  let ti=0;

    if(ti>=TREES.length){

    }
    const T=TREES[ti];
    const arr=S._tree&&S._tree.i===ti?S._tree.arr:shuffle(T.steps.map((s,i)=>({s,i})));
    S._tree={i:ti,arr:arr};
    area.innerHTML=`<div class="game"><span class="pill" style="background:rgba(23,195,178,.22);color:#5ff0e0">🌳 Árbol ${ti+1}/${TREES.length} · ${T.title}</span>

     <div id="trList"></div>
     <div class="row"><button class="btn teal" onclick="checkTree()">Comprobar</button><span id="trOut" class="small"></span></div></div>`;
    paintList();
  }
  window.checkTree=()=>{
    const T=TREES[S._tree.i];
    const good=S._tree.arr.every((o,k)=>o.i===k);
    if(good){
      $('#trOut').innerHTML=`<b style="color:#5ff0e0"> ¡Árbol correcto! 🌳</b><br><span style="color:#ffd23f">Lección: ${T.lesson}</span>`;
      sfx.ok();S._tree.i++;ti++;setTimeout(render,2400);
    }else{$('#trOut').innerHTML=`<b style="color:#ff9f9f"> Todavía no: revisa qué viene primero.</b>`;sfx.bad()}
  };
  function paintList(){
    $('#trList').innerHTML=S._tree.arr.map((o,k)=>`<div class="stepchip"><div class="n">${k+1}</div>
      <div style="flex:1">${o.s}</div>
      <button class="btn sm ghost" style="background:#eef3ff;color:#12203a" onclick="mvTree(${k},-1)">▲</button>
      <button class="btn sm ghost" style="background:#eef3ff;color:#12203a" onclick="mvTree(${k},1)">▼</button></div>`).join('');
  }
  window.mvTree=(k,d)=>{const a=S._tree.arr;const j=k+d;if(j<0||j>=a.length)return;[a[k],a[j]]=[a[j],a[k]];sfx.click();paintList()};
  render();
}

      if(qi>=D.qs.length){ci++;setTimeout(render,900);return}
      const Q=D.qs[qi];total++;
      $('#dlBody').innerHTML=`<div class="box info" style="color:#22304d"><b>${Q.t}</b></div>
       ${shuffle(Q.opts.map((o,i)=>({o,i}))).map(x=>`<button class="opt" data-i="${x.i}">${x.o}</button>`).join('')}
       <div id="dlOut"></div>`;
      $$('#dlBody .opt').forEach(b=>b.onclick=()=>{
        if(+b.dataset.i===Q.ok){b.classList.add('ok');ok++;sfx.ok();
          $('#dlOut').innerHTML=`<div class="box tip" style="color:#0b5d50"><b>PIX:</b> ${Q.why}</div>`;
          $$('#dlBody .opt').forEach(x=>x.classList.add('dis'));qi++;setTimeout(q,2000)}
        else{b.classList.add('no');sfx.bad();setTimeout(()=>b.classList.remove('no'),500)}
      });
    }
    q();
  }
  render();
}
function startPerms(){
  const items=shuffle(PERMS);let i=0,ok=0;
  const area=$('#g4area');
  area.innerHTML=`<div class="game"><span class="pill" style="background:rgba(23,195,178,.22);color:#5ff0e0">🔐 Auditor de permisos</span>
   <div class="pbar"><i id="pmBar"></i></div><div id="pmBody"></div></div>`;
  function render(){
    if(i>=items.length){
      const st=ok>=9?3:ok>=7?2:1;
      $('#pmBody').innerHTML=`<div style="text-align:center;padding:18px"><div class="starsrow">${'⭐'.repeat(st)}${'✩'.repeat(3-st)}</div>
       <h3 class="f" style="color:#fff">${ok}/${items.length} decisiones correctas</h3>
       <div class="box tip" style="color:#0b5d50;text-align:left"><b>Tarea real:</b> hoy mismo entra a Ajustes → Privacidad → Permisos y revoca 3 que no necesites.</div>
       <button class="btn teal" onclick="startPerms()">Otra vez 🔁</button></div>`;
      markDone('m4b',st,ok*12,'Auditoría de permisos completada');sfx.win();return;
    }
    const p=items[i];
    $('#pmBar').style.width=(i/items.length*100)+'%';
    $('#pmBody').innerHTML=`<div class="qbar"><div style="font-size:22px">${p.app}</div>
      <div style="font-size:15.5px;color:#dbe6fb;margin-top:4px">Solicita: <b style="color:#ffd23f">${p.perm}</b></div></div>
      <button class="opt" data-v="1">✅ Conservar permiso</button>
      <button class="opt" data-v="0">🚫 Revocar permiso</button>
      <div id="pmOut"></div>`;
    $$('#pmBody .opt').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v==='1';
      if(v===p.ok){b.classList.add('ok');ok++;sfx.ok();
        $('#pmOut').innerHTML=`<div class="box tip" style="color:#0b5d50"><b>PIX:</b> ${p.why}</div>`;
        $$('#pmBody .opt').forEach(x=>x.classList.add('dis'));i++;setTimeout(render,2100)}
      else{b.classList.add('no');sfx.bad();
        $('#pmOut').innerHTML=`<div class="box warn" style="color:#7a2020">Piensa en el principio de <b>minimización</b>: ¿ese permiso es necesario para la función principal?</div>`;
        setTimeout(()=>b.classList.remove('no'),500)}
    });
  }
  render();
}
function mission4(tb){
  tb.innerHTML=`
  <div class="card">
    <span class="pill" style="background:#f1eaff;color:#6b3fd1">Producto 4 · Manifiesto individual en papel pergamino</span>
    <h2 class="sec f" style="margin-top:10px">Mi Decálogo del Ciudadano Digital 📜</h2>
    <p class="lead">10 reglas. Cada una tiene su <b>mandato</b>, su <b>fundamento técnico-normativo</b>, su <b>fundamento ético-social</b>… y lo más importante: <b>TU compromiso de proyecto de vida</b>. Escríbelo con pluma fuente o tinta indeleble, con caligrafía legible y sin tachaduras.</p>
    <div class="artframe" style="max-width:420px;margin:0 auto">${ART.foot}</div>
  </div>
  <div id="decList"></div>
  <div class="card" style="margin-top:16px">
    <h3 class="f" style="margin:0 0 8px">Checklist de entrega</h3>
    <div id="m4Checks"></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 class="f" style="margin:0 0 8px">🏅 Generar mi diploma</h3>
    <input type="text" id="certName" placeholder="Nombre completo del ciudadano/a digital" value="${esc(S.name||'')}" style="max-width:460px">
    <div class="row" style="margin-top:12px">
      <button class="btn teal" onclick="finishMission4()">✅ Misión terminada</button>

      <button class="btn purple" onclick="go('diploma')">🏅 Ver diploma</button>
    </div>
  </div>`;
  const CH4=['Papel pergamino o de alto gramaje','Pluma fuente o tinta indeleble','Caligrafía legible, uniforme y sin tachaduras','Las 10 reglas con sus 4 partes completas','Carpeta física elaborada por mí','Sello con firma manuscrita (juramento cívico)','Ortografía y cohesión textual revisadas','Fecha y nombre de la institución'];
  renderChecks('m4Checks',CH4,S.m4,'checks');
  paintDec();
}
function paintDec(){
  const c=$('#decList');if(!c)return;
  c.innerHTML=DECALOGO.map((d,i)=>`
   <div class="acc ${S.m4.commit[i]?'open':''}">
    <button onclick="this.parentNode.classList.toggle('open');sfx.click()">
      <span class="ic" style="background:${['#17c3b2','#8b5cf6','#ff6b6b','#ffd23f','#4cc9f0'][i%5]}22;color:${['#17c3b2','#8b5cf6','#ff6b6b','#e0b31f','#4cc9f0'][i%5]}">${i+1}</span>
      <span>Regla ${i+1}: ${d.m}</span>
      <span class="ar">${S.m4.commit[i]?'✔':'▶'}</span>
    </button>
    <div class="in"><div class="pad">
      <div class="box info"><b>⚙️ Fundamento técnico-normativo:</b> ${d.tec}</div>
      <div class="box tip"><b>🤝 Fundamento ético-social:</b> ${d.eti}</div>
      <label class="small"><b>🎯 Mi compromiso de proyecto de vida</b> (mínimo 12 palabras)</label>
      <textarea rows="3" oninput="setCommit(${i},this.value)" placeholder="Cómo lo aplicaré en mi vida y en mi futura carrera…">${esc(S.m4.commit[i]||'')}</textarea>
      <div class="count" id="cw${i}">${(S.m4.commit[i]||'').trim().split(/\\s+/).filter(Boolean).length} / 12 palabras mín.</div>
    </div></div></div>`).join('');
}
function setCommit(i,v){
  S.m4.commit[i]=v;save();
  const w=v.trim()?v.trim().split(/\s+/).length:0;
  const el=document.getElementById('cw'+i);
  if(el){el.textContent=w+' / 12 palabras mín.';el.className='count '+(w>=12?'good':'')}
}
function finishMission4(){
  const done=DECALOGO.map((d,i)=>(S.m4.commit[i]||'').trim().split(/\s+/).filter(Boolean).length>=12).filter(Boolean).length;
  if(done<10){toast('Te faltan compromisos por escribir ('+done+'/10)');return}
  if((S.m4.checks||[]).length<6){toast('Marca al menos 6 puntos del checklist');return}
  completeMission('m4','¡Decálogo del Ciudadano Digital terminado!');
}
function printDecalogo(){
  doPrint(`<h1 style="text-align:center;text-decoration:underline">Decálogo de Ciudadanía y Supervivencia Digital</h1>
  <p style="text-align:center">Yo, ${esc($('#certName')?$('#certName').value:S.name||'__________')}, declaro mi juramento cívico digital.</p>
  ${DECALOGO.map((d,i)=>`<h3>Regla ${i+1}: ${d.m}</h3>
   <p><b>Argumento técnico y normativo:</b> ${d.tec}</p>
   <p><b>Argumento ético y social:</b> ${d.eti}</p>
   <p><b>Compromiso de proyecto de vida:</b> ${esc(S.m4.commit[i]||'________________________')}</p>`).join('')}
  <p style="margin-top:36px">Firma: ______________________ · Fecha: ____________ · Institución: ______________________</p>`);
}

    <p style="font-size:16px;margin:4px 0">Se otorga a</p>
